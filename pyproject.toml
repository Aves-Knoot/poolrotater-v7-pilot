[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "poolrotater-host"
version = "7.0.0.dev27"
description = "Offline foundation for Distributed PoolRotater"
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 2 - Pre-Alpha", "Operating System :: POSIX :: Linux"]
# License selection is pending. This local development package is not published.
dependencies = []

[project.optional-dependencies]
catalogs = ["tuf==7.0.1", "securesystemslib[crypto]==1.5.1", "cryptography==50.0.2", "cffi==2.1.1", "pycparser==3.0", "urllib3==2.8.0"]

[project.scripts]
poolrotater-host = "poolrotater_host.cli:main"

[tool.setuptools.packages.find]
include = ["poolrotater_host*", "bot"]

[tool.setuptools]
py-modules = []
include-package-data = false
